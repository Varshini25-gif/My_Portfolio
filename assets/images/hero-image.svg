<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#F9FAFB"/>
  
  <!-- Decorative circles -->
  <circle cx="650" cy="100" r="80" fill="#E0E7FF" opacity="0.6"/>
  <circle cx="150" cy="500" r="60" fill="#DDD6FE" opacity="0.6"/>
  <circle cx="700" cy="450" r="50" fill="#C7D2FE" opacity="0.6"/>
  
  <!-- Main illustration - Person with laptop -->
  <g>
    <!-- Laptop base -->
    <rect x="250" y="350" width="300" height="180" rx="10" fill="#6366F1"/>
    <rect x="260" y="360" width="280" height="150" rx="5" fill="#4F46E5"/>
    <rect x="270" y="370" width="260" height="130" rx="3" fill="#F9FAFB"/>
    
    <!-- Laptop screen content -->
    <rect x="280" y="380" width="240" height="110" rx="2" fill="#E0E7FF"/>
    <rect x="290" y="390" width="100" height="8" rx="2" fill="#6366F1"/>
    <rect x="290" y="405" width="220" height="6" rx="2" fill="#C7D2FE"/>
    <rect x="290" y="418" width="220" height="6" rx="2" fill="#C7D2FE"/>
    <rect x="290" y="431" width="180" height="6" rx="2" fill="#C7D2FE"/>
    <rect x="290" y="444" width="200" height="6" rx="2" fill="#C7D2FE"/>
    <rect x="290" y="457" width="150" height="6" rx="2" fill="#C7D2FE"/>
    
    <!-- Code brackets -->
    <text x="290" y="400" font-family="monospace" font-size="24" fill="#8B5CF6">&lt;/&gt;</text>
    
    <!-- Coffee cup -->
    <ellipse cx="600" cy="420" rx="25" ry="5" fill="#8B5CF6"/>
    <rect x="575" y="395" width="50" height="25" rx="5" fill="#A78BFA"/>
    <rect x="575" y="390" width="50" height="5" rx="2" fill="#C4B5FD"/>
    <rect x="625" y="395" width="5" height="15" rx="2" fill="#8B5CF6"/>
    
    <!-- Plant -->
    <ellipse cx="180" cy="430" rx="30" ry="10" fill="#8B5CF6"/>
    <ellipse cx="170" cy="410" rx="15" ry="25" fill="#10B981"/>
    <ellipse cx="190" cy="405" rx="18" ry="30" fill="#059669"/>
    <ellipse cx="180" cy="400" rx="12" ry="20" fill="#10B981"/>
  </g>
  
  <!-- Floating elements -->
  <g opacity="0.7">
    <!-- Code symbols -->
    <text x="100" y="150" font-family="monospace" font-size="36" fill="#6366F1">{}</text>
    <text x="650" y="250" font-family="monospace" font-size="36" fill="#8B5CF6">[]</text>
    <text x="120" y="300" font-family="monospace" font-size="30" fill="#A78BFA">&lt;&gt;</text>
  </g>
  
  <!-- Geometric shapes -->
  <rect x="680" y="350" width="40" height="40" rx="5" fill="#DDD6FE" opacity="0.6" transform="rotate(15 700 370)"/>
  <circle cx="100" cy="180" r="15" fill="#C7D2FE" opacity="0.6"/>
</svg>
